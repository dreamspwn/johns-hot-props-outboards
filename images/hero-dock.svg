<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f5f95"/>
      <stop offset="60%" stop-color="#154273"/>
      <stop offset="100%" stop-color="#0a2c4d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2c4d"/>
      <stop offset="100%" stop-color="#06192e"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="700" fill="url(#sky)"/>
  <circle cx="1100" cy="180" r="90" fill="#d9ae5c" opacity="0.85"/>
  <rect y="430" width="1400" height="270" fill="url(#water)"/>
  <g opacity="0.35" stroke="#d9ae5c" stroke-width="3" fill="none">
    <path d="M0 470 Q 100 455 200 470 T 400 470 T 600 470 T 800 470 T 1000 470 T 1200 470 T 1400 470"/>
    <path d="M0 510 Q 100 495 200 510 T 400 510 T 600 510 T 800 510 T 1000 510 T 1200 510 T 1400 510"/>
  </g>
  <!-- dock posts -->
  <g fill="#0a2c4d" stroke="#06192e" stroke-width="2">
    <rect x="150" y="380" width="18" height="130"/>
    <rect x="330" y="380" width="18" height="130"/>
    <rect x="510" y="380" width="18" height="130"/>
    <rect x="690" y="380" width="18" height="130"/>
  </g>
  <!-- dock deck -->
  <rect x="120" y="365" width="620" height="26" fill="#154273" stroke="#06192e" stroke-width="2"/>
  <!-- boat silhouette -->
  <g>
    <path d="M900 430 L1180 430 L1140 470 L940 470 Z" fill="#06192e"/>
    <rect x="990" y="380" width="70" height="55" rx="4" fill="#0a2c4d" stroke="#06192e" stroke-width="2"/>
  </g>
</svg>
